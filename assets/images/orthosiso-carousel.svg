<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc">
  <title id="title">Carrossel institucional Orthosiso</title>
  <desc id="desc">Cinco painéis apresentam a Orthosiso e seus serviços para dentistas, estudantes e clínicas.</desc>
  <rect width="1600" height="250" fill="#f2f7f5"/>
  <g font-family="Arial,sans-serif">
    <rect width="300" height="250" fill="#064d4e"/><text x="38" y="45" fill="#7ee0d4" font-size="17" font-weight="700">DENTAL ORTHOSISO</text><text x="38" y="105" fill="#fff" font-size="31" font-weight="800">Somos a</text><text x="38" y="140" fill="#fff" font-size="31" font-weight="800">Orthosiso</text><text x="38" y="178" fill="#cce8e2" font-size="15">Há mais de 20 anos ajudando</text><text x="38" y="199" fill="#cce8e2" font-size="15">a construir sorrisos.</text>
    <path d="M300 0h315l-70 250H300z" fill="#e9f1ef"/><text x="345" y="58" fill="#064d4e" font-size="24" font-weight="800">Para dentistas</text><text x="345" y="100" fill="#234e4e" font-size="15" font-weight="700">Tudo para o seu dia a dia</text><text x="345" y="127" fill="#476363" font-size="14">Produtos selecionados para</text><text x="345" y="146" fill="#476363" font-size="14">acompanhar sua rotina profissional.</text><text x="345" y="188" fill="#234e4e" font-size="15" font-weight="700">Conte com especialistas</text>
    <rect x="575" width="330" height="250" fill="#0a5556"/><text x="620" y="58" fill="#fff" font-size="24" font-weight="800">Para estudantes</text><text x="620" y="100" fill="#fff" font-size="15" font-weight="700">Tudo para o seu curso</text><text x="620" y="127" fill="#cce0dc" font-size="14">Encontre os materiais que você</text><text x="620" y="146" fill="#cce0dc" font-size="14">precisa em cada etapa da formação.</text><text x="620" y="188" fill="#fff" font-size="15" font-weight="700">Escolha com confiança</text>
    <rect x="905" width="345" height="250" fill="#063f40"/><text x="950" y="58" fill="#fff" font-size="24" font-weight="800">Para clínicas</text><text x="950" y="100" fill="#fff" font-size="15" font-weight="700">Mais agilidade no dia a dia</text><text x="950" y="127" fill="#cce0dc" font-size="14">Reponha materiais com praticidade</text><text x="950" y="146" fill="#cce0dc" font-size="14">e mantenha sua clínica em movimento.</text><text x="950" y="188" fill="#fff" font-size="15" font-weight="700">Uma parceria de confiança</text>
    <rect x="1250" width="350" height="250" fill="#edf3f1"/><text x="1290" y="60" fill="#264d4d" font-size="18" font-weight="700">Usamos nossa experiência para</text><text x="1290" y="84" fill="#264d4d" font-size="18" font-weight="700">ajudar você a fazer escolhas</text><text x="1290" y="108" fill="#064d4e" font-size="18" font-weight="900">mais inteligentes.</text><rect x="1290" y="132" width="250" height="48" rx="4" fill="#064d4e"/><text x="1415" y="162" text-anchor="middle" fill="#fff" font-size="15">Atendimento especializado</text><rect x="1340" y="202" width="150" height="26" rx="13" fill="#ff7a2c"/><text x="1415" y="220" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">FALE COM A GENTE</text>
  </g>
</svg>
